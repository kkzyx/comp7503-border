<div class="simple-panel" ng-if="msg.payload.points"><strong>Same-day rainfall and passenger count</strong><div class="simple-muted">One point per valid matched date</div><svg viewBox="0 0 550 275" style="width:100%;max-height:255px" role="img" aria-label="Rainfall and daily passenger scatter plot"><g ng-repeat="tick in msg.payload.ticks"><line x1="62" x2="512" ng-attr-y1="{{tick.y}}" ng-attr-y2="{{tick.y}}" stroke="#77858b" opacity=".5"></line><text x="55" ng-attr-y="{{tick.y+4}}" fill="currentColor" font-size="10" text-anchor="end">{{tick.passengers | number:0}}</text><text ng-attr-x="{{tick.x}}" y="240" fill="currentColor" font-size="10" text-anchor="middle">{{tick.rain}}</text></g><circle ng-repeat="point in msg.payload.points" ng-attr-cx="{{point.x}}" ng-attr-cy="{{point.y}}" r="3" fill="#29a2a8" opacity=".65"><title>{{point.day}} · {{point.rain}} mm · {{point.passengers}} passengers</title></circle><text x="62" y="16" fill="currentColor" font-size="11">Passengers / day</text><text x="280" y="266" fill="currentColor" font-size="11" text-anchor="middle">Sheung Shui daily rainfall (mm)</text></svg><div class="simple-muted" ng-if="!msg.payload.points.length">No valid pairs. No synthetic records.</div></div>
