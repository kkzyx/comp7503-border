<div class="simple-panel" ng-if="msg.payload.cards"><strong>Upcoming trains</strong><table class="simple-table"><thead><tr><th>Destination</th><th>Platform</th><th>ETA · HKT</th><th>Min</th></tr></thead><tbody ng-repeat="card in msg.payload.cards"><tr ng-repeat="train in card.trains"><td>{{card.destination === 'LOW' ? 'Lo Wu' : 'Lok Ma Chau'}}</td><td>{{train.platform}}</td><td>{{train.predictedAt | date:'HH:mm':'+0800'}}</td><td>{{train.waitMin}}</td></tr><tr ng-if="!card.trains.length"><td>{{card.name}}</td><td colspan="3">{{card.railNote}}</td></tr></tbody></table><div class="simple-muted" style="margin-top:8px">Next two matching predictions. A missing destination does not prove no service.</div></div>
