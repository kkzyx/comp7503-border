name: comp7503-border

services:
  mongodb:
    image: mongo:7.0.45
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nodered:
    build: .
    image: comp7503-border:1.2.0
    restart: unless-stopped
    environment:
      TZ: Asia/Hong_Kong
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    ports:
      - "127.0.0.1:${BORDER_PORT:-1880}:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1880/ui/').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
  nodered_data:
